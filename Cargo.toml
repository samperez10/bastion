[workspace]
members = [
    "crates/workspace-core",
    "crates/workspace-protocol",
    "crates/workspace-terminal",
    "crates/workspace-daemon",
    "crates/termux-tui",
    "crates/workspace-agent",
    "crates/bastion",
    "crates/bastion-audio",
    "crates/terminal-lab",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
crossterm = "0.29"
portable-pty = "0.9"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
